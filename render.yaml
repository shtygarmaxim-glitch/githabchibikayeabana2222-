services:
  - type: web
    name: tma-gaming-platform
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tma-postgres
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true

databases:
  - name: tma-postgres
    plan: free
